[pytest]
testpaths = tests/unit
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers --tb=short --ignore=__init__.py
markers =
    unit: Unit tests that don't require Blender
    smoke: Integration tests that require Blender headless mode
# Don't try to import parent packages
pythonpath = .